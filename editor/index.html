<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jamground Editor</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #wp {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    #jamground-controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      /* A column so the standing note sits above the buttons inside the same card. It was a row
         of buttons; the note is part of the same object, not a second floating thing. */
      flex-direction: column;
      gap: 10px;
      z-index: 10000;
      background: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #jamground-control-buttons {
      display: flex;
      gap: 10px;
    }
    /* PERMANENT, AND THERE IS NO CONTROL TO DISMISS IT. A notice an editor can close is a notice
       most editors have closed, and the thing it says — which parts of this screen are the site
       and which are settled elsewhere — does not stop being true after it is read once. */
    #jamground-standing-note {
      margin: 0;
      max-width: 420px;
      color: #4c5461;
      font-size: 12px;
      line-height: 1.45;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .jamground-control-button {
      padding: 8px 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      font-size: 14px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .jamground-control-button:hover {
      background: #f5f5f5;
    }
    .jamground-control-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    /* Sits directly above the control bar and is styled as the same card. Without a
       background of its own it rendered as bare text straight onto whatever wp-admin had
       painted underneath, which is legible or not depending entirely on what the editor
       happens to be looking at — and the one moment it matters most is when it is reporting
       that an action failed. z-index is one above the controls so a long message that wraps
       past its own box is never painted under them. */
    #jamground-status {
      position: fixed;
      bottom: 74px;
      right: 20px;
      z-index: 10001;
      max-width: 360px;
      padding: 10px 14px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      color: #1e1e1e;
      font-size: 13px;
      line-height: 1.4;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #jamground-status:empty {
      display: none;
    }
  </style>
</head>
<body id="jamground-shell">
  <iframe id="wp"></iframe>
  <div id="jamground-status" role="status" aria-live="polite"></div>
  <div id="jamground-controls">
    <!-- Filled from VOCAB.standingNote by entry.mjs rather than written here, so it is subject to
         test/gates/editorial-vocabulary.test.mjs like every other editor-facing string. Empty in
         the markup for the same reason the buttons are not: a second copy of the words is a second
         thing to keep in step. -->
    <p id="jamground-standing-note"></p>
    <div id="jamground-control-buttons">
      <button id="jamground-control-signIn" class="jamground-control-button">sign in</button>
      <button id="jamground-control-startAChange" class="jamground-control-button" disabled>start a change</button>
      <button id="jamground-control-save" class="jamground-control-button" disabled>save this change</button>
      <button id="jamground-control-sendForReview" class="jamground-control-button" disabled>send for review</button>
      <button id="jamground-control-publish" class="jamground-control-button" disabled>publish</button>
    </div>
  </div>
  <script type="module" src="shell.js"></script>
</body>
</html>
