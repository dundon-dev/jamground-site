# The healthy shape: a module check mode understands, and a command that says what it does.
- name: A file, which check mode models correctly and needs no declaration
  ansible.builtin.file:
    path: /srv/jamground
    state: directory
    mode: '0755'

- name: A read-only command, run during --check so its result is real
  ansible.builtin.command: nginx -t
  check_mode: false
  changed_when: false
