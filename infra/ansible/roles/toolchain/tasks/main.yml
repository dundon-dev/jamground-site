---
# Install the exact Node.js version from .nvmrc (25.6.1) into /opt from the official nodejs.org
# tarball, with checksum verification against published SHASUMS256.txt. Owned by root, readable
# and executable by jamground-build with no privilege.
# Idempotent by construction: get_url with checksum:, unarchive with creates:, file with state: link.

- name: Ensure /opt directory exists
  ansible.builtin.file:
    path: /opt
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download Node.js SHASUMS256.txt
  ansible.builtin.get_url:
    url: https://nodejs.org/dist/v25.6.1/SHASUMS256.txt
    dest: /tmp/SHASUMS256.txt
    mode: '0644'

- name: Read SHASUMS256.txt to extract checksum for node-v25.6.1-linux-x64.tar.xz
  ansible.builtin.slurp:
    src: /tmp/SHASUMS256.txt
  register: shasums_file

- name: Extract checksum for node-v25.6.1-linux-x64.tar.xz
  ansible.builtin.set_fact:
    node_checksum: "sha256:{{ (shasums_file.content | b64decode | regex_search('^([a-f0-9]+)\\s+node-v25\\.6\\.1-linux-x64\\.tar\\.xz$', '\\1', multiline=True))[0] }}"

- name: Download Node.js tarball with checksum verification
  ansible.builtin.get_url:
    url: https://nodejs.org/dist/v25.6.1/node-v25.6.1-linux-x64.tar.xz
    dest: /tmp/node-v25.6.1-linux-x64.tar.xz
    checksum: "{{ node_checksum }}"
    mode: '0644'

- name: Extract Node.js tarball to /opt
  ansible.builtin.unarchive:
    src: /tmp/node-v25.6.1-linux-x64.tar.xz
    dest: /opt
    remote_src: true
    creates: /opt/node-v25.6.1-linux-x64/bin/node
    owner: root
    group: root
    mode: '0755'

- name: Create symlink /usr/local/bin/node
  ansible.builtin.file:
    src: /opt/node-v25.6.1-linux-x64/bin/node
    dest: /usr/local/bin/node
    state: link
    owner: root
    group: root

- name: Create symlink /usr/local/bin/npm
  ansible.builtin.file:
    src: /opt/node-v25.6.1-linux-x64/bin/npm
    dest: /usr/local/bin/npm
    state: link
    owner: root
    group: root

- name: Ensure jamground-build can read and execute node
  ansible.builtin.file:
    path: /opt/node-v25.6.1-linux-x64
    state: directory
    mode: 'o+rx'
    recurse: true
