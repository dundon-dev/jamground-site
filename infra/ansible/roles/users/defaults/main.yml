---
# The two commands the orchestrator account is allowed to run as root. Declared once here so
# the task that later creates the scripts themselves — flipping the release symlink and
# reloading nginx — points at the same paths this role's sudoers entry grants,
# rather than the two copies drifting apart.
jamground_release_switch: /usr/local/sbin/jamground-release-switch
jamground_reload_nginx: /usr/local/sbin/jamground-reload-nginx
