---
# Two repositories, two SSH deploy keys, one clone per repository — mechanically pulled, never
# pushed to. Nothing here writes to either clone — a clone is what the box PULLS, and a role
# that edited it would be faking that pull model rather than testing it.
# Performing a build from these clones, and flipping `current` onto it, is a separate role's
# job: this role's whole responsibility ends at "the box holds two current, read-only clones".
#
# The read-only property of each deploy key is not something this role can assert about
# itself; it is a property of how the key was registered above (`read_only: true`), not of
# these tasks.
# What the clones actually CONTAIN — a buildable site tree, a real content/ tree — is asserted by
# verify/content-repos.yml, a state assertion rather than a log grep.
#
# Registration happens with `delegate_to: localhost` throughout: `gh auth token` never
# leaves the control node, and the box never sees a GitHub credential capable of writing
# anything — the whole point of the pull model is that nothing in GitHub holds a credential that
# can reach the box, and the converse holds too: the box holds no credential GitHub would honour
# for a write.

- name: Ensure the /etc/jamground directory exists
  ansible.builtin.file:
    path: /etc/jamground
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure the deploy-key directory exists
  ansible.builtin.file:
    path: "{{ content_repos_keys_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Generate the site repository's own deploy keypair
  community.crypto.openssh_keypair:
    path: "{{ content_repos_site_key }}"
    type: ed25519
    comment: "jamground-vps deploy key — {{ content_repos_org }}/{{ content_repos_site_repo }} (read-only)"
    owner: jamground-build
    group: jamground-build
    mode: '0600'
  register: content_repos_site_keypair

- name: Generate the content repository's own deploy keypair
  community.crypto.openssh_keypair:
    path: "{{ content_repos_content_key }}"
    type: ed25519
    comment: "jamground-vps deploy key — {{ content_repos_org }}/{{ content_repos_content_repo }} (read-only)"
    owner: jamground-build
    group: jamground-build
    mode: '0600'
  register: content_repos_content_keypair

- name: Read a GitHub token from the control node's own gh session — never copied to the box
  ansible.builtin.command: gh auth token
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: content_repos_gh_token
  no_log: true

- name: Check whether the organisation currently allows deploy keys on its repositories
  ansible.builtin.uri:
    url: "https://api.github.com/orgs/{{ content_repos_org }}"
    method: GET
    headers:
      Authorization: "token {{ content_repos_gh_token.stdout }}"
      Accept: application/vnd.github+json
  register: content_repos_org_settings
  no_log: true
  delegate_to: localhost
  become: false

# This organisation is created with deploy keys disabled for every
# repository it holds — `POST .../keys` returns 422 "Deploy keys are disabled for this
# repository" regardless of token scope or per-repository admin rights, because the setting is
# organisation-wide, not per-repository. `admin:org` is exactly the scope that flips it, and
# the register tasks below cannot succeed until this one has.
- name: Enable deploy keys for this organisation's repositories — off by default, org-wide
  ansible.builtin.uri:
    url: "https://api.github.com/orgs/{{ content_repos_org }}"
    method: PATCH
    headers:
      Authorization: "token {{ content_repos_gh_token.stdout }}"
      Accept: application/vnd.github+json
    body_format: json
    body:
      deploy_keys_enabled_for_repositories: true
    status_code: [200]
  when: not (content_repos_org_settings.json.deploy_keys_enabled_for_repositories | default(false))
  delegate_to: localhost
  become: false
  no_log: true
  changed_when: true

- name: Register the site repository's deploy key, read-only, from the control node
  community.general.github_deploy_key:
    owner: "{{ content_repos_org }}"
    repo: "{{ content_repos_site_repo }}"
    name: "jamground-vps ({{ content_repos_site_repo }}, read-only)"
    key: "{{ content_repos_site_keypair.public_key }}"
    read_only: true
    token: "{{ content_repos_gh_token.stdout }}"
  delegate_to: localhost
  become: false
  no_log: true

- name: Register the content repository's deploy key, read-only, from the control node
  community.general.github_deploy_key:
    owner: "{{ content_repos_org }}"
    repo: "{{ content_repos_content_repo }}"
    name: "jamground-vps ({{ content_repos_content_repo }}, read-only)"
    key: "{{ content_repos_content_keypair.public_key }}"
    read_only: true
    token: "{{ content_repos_gh_token.stdout }}"
  delegate_to: localhost
  become: false
  no_log: true

- name: Ensure the checkout root exists, owned by the unprivileged build account
  ansible.builtin.file:
    path: "{{ content_repos_root }}"
    state: directory
    owner: jamground-build
    group: jamground-build
    mode: '0755'

- name: Ensure git is installed
  ansible.builtin.apt:
    name: git
    state: present

# `key_file` makes the git module set `IdentitiesOnly=yes` itself, so each clone only ever offers
# the one key cut for it — the same boundary the two-keypair design holds on the GitHub side.
# `accept_newhostkey` is trust-on-first-use for github.com's host key; there is no earlier point
# in this role where that trust could be established some other way.
#
# `force: true` on both, because these are MIRRORS and not working copies. Both remotes have been
# force-pushed to a new root commit, so what is on the box shares no history with what it must
# now hold — and nothing on this box writes into either tree: this role does not edit them, and
# the build reads them and writes only dist/, .astro/ and node_modules/, all three untracked and
# gitignored. The remote is authoritative by construction, so "discard whatever is here and take
# what is there" is not a risk being accepted here; it is the only thing a reconcile can mean.
#
# What it actually buys, since `version: HEAD` makes the module `git reset --hard origin/<branch>`
# either way: the fetch becomes `git fetch --tags --force`, so a tag the force-push moved is
# updated rather than refused as a clobber (branches already update non-fast-forward through the
# `+refs/heads/*` refspec a clone configures, tags do not); and a tracked file that somehow
# differs is reset instead of failing the task outright with "Local modifications exist".
#
# The day anything on this box legitimately writes into these trees, this flag has to go with it.
# From then on a converge would silently destroy that work, and the box would have stopped being
# a mirror with nothing here left to say so.
- name: Clone (or reconcile) the site repository over its own read-only deploy key
  ansible.builtin.git:
    repo: "git@github.com:{{ content_repos_org }}/{{ content_repos_site_repo }}.git"
    dest: "{{ content_repos_site_checkout }}"
    version: HEAD
    key_file: "{{ content_repos_site_key }}"
    accept_newhostkey: true
    force: true
  become: true
  become_user: jamground-build
  register: content_repos_site_checkout_result

- name: Clone (or reconcile) the content repository over its own read-only deploy key
  ansible.builtin.git:
    repo: "git@github.com:{{ content_repos_org }}/{{ content_repos_content_repo }}.git"
    dest: "{{ content_repos_content_checkout }}"
    version: HEAD
    key_file: "{{ content_repos_content_key }}"
    accept_newhostkey: true
    force: true
  become: true
  become_user: jamground-build
  register: content_repos_content_checkout_result

# BEFORE ANY BUILD, and after the clones that may have just created the checkout.
#
# jamground-deploy used to run its `npm ci && npm run build` as whoever invoked it, and the task
# below invoked it with no become_user — as root. Every artefact under the shared site checkout was
# therefore root-owned, on a box where the account that builds is jamground-build. Production kept
# working (root writes what root owns) and the first real PREVIEW build did not: jamground-build
# cannot write root's .astro/, and `astro build` failed with EACCES on .astro/content.d.ts. The
# script is fixed — it drops for the build now — but a fixed script cannot chown what an earlier
# converge already left behind, so this repairs it once and then reports nothing forever.
#
# Idempotent by construction rather than by intent: `file:` with `recurse: true` compares owner and
# group per entry and reports changed only where it actually changed one. No `mode:` — that would
# rewrite the permissions npm wrote across node_modules/, .bin/ included, on every converge.
#
# Only paths that ALREADY EXIST, which is why this is stat-then-set rather than one `file:` with
# `state: directory`. That form would CREATE an empty node_modules/ on a box that has never built,
# and jamground-preview-build refuses to build when node_modules/ is missing precisely so it never
# runs against a half-installed tree — an empty directory would satisfy that guard and turn a clear
# refusal into a confusing build failure.
- name: Find which build outputs the site checkout already carries
  ansible.builtin.stat:
    path: "{{ content_repos_site_checkout }}/{{ item }}"
  loop: "{{ content_repos_build_outputs }}"
  register: content_repos_build_output_stats

- name: Give the build account the build outputs, whoever built them last
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: directory
    owner: jamground-build
    group: jamground-build
    recurse: true
  loop: "{{ content_repos_build_output_stats.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"

# jamground-deploy names every release `<utc>-<contentSha7>-<siteSha7>` and records both SHAs
# in the manifest — a fact about the RELEASE, not a one-shot latch. An earlier version of this
# task gated the one deploy it ever performed on `current` still naming roles/deploy's
# placeholder seed release: true exactly once, and permanently false on every converge since,
# which skipped the build and reported converged — a false green, the worst available shape
# here. Comparing the manifest to what is actually on disk right now survives every later
# content or site change and needs nothing reset by hand.
# THE SHARED BUILD LOCK, CREATED BEFORE ANYTHING CAN TAKE IT.
#
# jamground-deploy and jamground-preview-build both flock "$JAMGROUND_SITE_CHECKOUT/.build.lock"
# now, and neither creates it deliberately — `flock` and `exec 9>` each create it on first use, as
# whoever got there first. That is the whole problem: the first taker is very often root (this
# role's own deploy below, or an operator following the RUNBOOK), which leaves a root-owned file
# that jamground-build cannot open for write — and every preview build from then on dies with
# EACCES on the lock rather than on anything to do with the preview. So the converge creates it,
# owned by the account that cannot create it itself, before the task below can.
#
# `modification_time`/`access_time: preserve` is what makes `state: touch` idempotent; without
# them this task reports changed on every converge, which is how a converge stops meaning
# anything.
- name: Ensure the shared build lock exists, owned by the account that builds
  ansible.builtin.file:
    path: "{{ content_repos_site_checkout }}/.build.lock"
    state: touch
    owner: jamground-build
    group: jamground-build
    mode: '0644'
    modification_time: preserve
    access_time: preserve

- name: Read the current release's manifest, to tell a real build from a stale one
  ansible.builtin.slurp:
    path: "{{ content_repos_deploy_current }}/manifest.json"
  register: content_repos_current_manifest_slurp

# AS ROOT, EXPLICITLY, and not as jamground-build. The two halves of a deploy need two different
# privilege levels and jamground-deploy separates them itself: it drops to jamground-build for the
# build (`sudo -n -H -u`, which only root can do — jamground-build holds no sudo at all and
# jamground holds exactly three no-argument entries) and calls the two privileged wrappers directly.
# Running this task as jamground-build instead would keep the build unprivileged and then be unable
# to flip; running it as jamground would build as jamground and leave the same class of
# wrongly-owned artefacts this role now repairs above. Written out rather than inherited from the
# connection user, because "root" is a requirement of this task and not an accident of the play.
# test/gates/deploy-unprivileged-build.test.mjs holds it.
- name: Pull, build and flip when current does not name both checkouts' HEAD
  ansible.builtin.command: "{{ content_repos_deploy_script }}"
  become: true
  become_user: root
  environment:
    JAMGROUND_SITE_CHECKOUT: "{{ content_repos_site_checkout }}"
    JAMGROUND_CONTENT_CHECKOUT: "{{ content_repos_content_checkout }}"
  when: >-
    (content_repos_current_manifest_slurp.content | b64decode | from_json).contentSha
      != content_repos_content_checkout_result.after[:7]
    or (content_repos_current_manifest_slurp.content | b64decode | from_json).siteSha
      != content_repos_site_checkout_result.after[:7]
  changed_when: true
