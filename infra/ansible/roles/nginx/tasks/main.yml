---
# The whole of the box's web serving: the / -> /en-us/ redirect (from
# Settings.defaultLocale), static file serving via try_files, a preview server block whose
# per-pull-request root is a named regex capture — so a preview coming or going is a mkdir and an
# rm, and nginx is never reloaded for either — and the reverse proxy that routes GitHub's webhook
# deliveries to the receiver roles/webhook runs.
#
# This role converges BEFORE any certificate exists — roles/certificates runs after it — so
# the TLS server blocks in the template are conditional on a stat fact rather than unconditionally
# present. A template referencing a certificate file that is not yet on disk fails `nginx -t` on
# the very first converge, which would block the certificate task that would otherwise fix it.

- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Check whether the live certificate exists yet
  ansible.builtin.stat:
    path: "{{ nginx_cert_dir }}/fullchain.pem"
  register: jamground_cert_stat

- name: Render the nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
    # A syntax error dropped straight onto the box's only web server has no console to recover
    # it from — validate against a rendered temp copy first, same reasoning as roles/users'
    # `visudo -cf %s`.
    validate: 'nginx -t -c %s'
  notify: reload nginx

- name: Ensure nginx is enabled and running
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
