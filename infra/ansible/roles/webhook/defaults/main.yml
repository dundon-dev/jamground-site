---
# Paths and identity for the webhook receiver (`infra/hooks/` is the application code; this
# role is the courier). Repeated as literals rather than imported from
# a sibling role's variables — the same reasoning roles/content_repos and roles/deploy already
# give for not trusting another role's variable names to stay stable.
webhook_app_dir: /opt/jamground/webhook
webhook_state_dir: /var/lib/jamground-hooks
webhook_queue_dir: "{{ webhook_state_dir }}/queue"
webhook_markers_dir: "{{ webhook_state_dir }}/markers"
webhook_locks_dir: "{{ webhook_state_dir }}/locks"
webhook_secret_file: /etc/jamground/webhook.secret
webhook_port: 9000
webhook_service_name: jamground-webhook

# The queue CONSUMER — a oneshot plus a timer, not a daemon. It belongs to this role because
# infra/hooks/ is one application and this role is its courier: the same tree that ships
# server.mjs ships consume.mjs, and the queue, lock and quarantine directories are declared once,
# here, for the two processes that share them.
#
# webhook_failed_dir is where a job the consumer could not handle is moved, intact. It is NOT a
# subdirectory of the queue: the consumer reads the queue every minute, and a quarantined job
# still sitting inside it would be re-read and re-quarantined forever.
webhook_failed_dir: "{{ webhook_state_dir }}/failed"
# A writable HOME for the build the consumer runs. The unit sets ProtectHome=yes, so
# /home/jamground-build is not there to be written to, and npm and git both want somewhere to put
# a cache and a known_hosts file — pointed inside the state directory this unit already owns
# rather than left to fail somewhere nobody looks.
webhook_home_dir: "{{ webhook_state_dir }}/home"
webhook_consumer_service_name: jamground-hooks-consume
webhook_consumer_timer_name: jamground-hooks-consume.timer
# The path unit is what actually starts the consumer in the normal case; the timer above is the
# backstop for a job that arrives while a build is already running.
webhook_consumer_path_name: jamground-hooks-consume.path

# Four paths that belong to roles/isolation and roles/content_repos, repeated here as literals
# under the convention this file's header already states: a role must not depend on a sibling
# role's variable names staying stable, and both of those roles converge AFTER this one, so their
# defaults are not merely unstable here — they are unloaded. The consumer is written to survive
# that ordering: it refuses to process a single job until the previews root exists and the build
# script is executable, so the ticks between this role converging and roles/isolation converging
# are retries rather than a queue full of jobs quarantined for the box's own half-built state.
# The slice the consumer — and therefore every preview build it spawns — runs inside.
# roles/isolation owns this slice and its caps; repeated here as a literal for the same reason
# webhook_previews_root is (a role's defaults are not loaded until that role runs), and gated by
# test/gates/preview-slice.test.mjs rather than promised.
#
# WHY IT MATTERS. Without it the consumer is a child of nothing in particular, and the Astro build
# it invokes inherits that: no MemoryMax, on the box that is also serving production. The slice's
# whole purpose is that a preview build cannot starve the site, and a build reached through the
# automatic path is exactly the one nobody is watching when it runs.
webhook_preview_slice: jamground-preview.slice
webhook_previews_root: /srv/previews
webhook_preview_build_script: /usr/local/bin/jamground-preview-build
# Where the consumer writes a deploy REQUEST when a pull request merges. roles/deploy owns this
# directory and the units that drain it; repeated here as a literal under the same convention as
# the four paths above, and gated against roles/deploy's own copy — and against
# DEFAULT_DEPLOY_REQUESTS_DIR in infra/hooks/lib/consumer.mjs — by
# test/gates/deploy-request-path-unit.test.mjs.
#
# It is NOT under webhook_state_dir, even though this role's process is the only writer. The
# READER is the `jamground` account, and /var/lib/jamground-hooks is jamground-build's own state
# directory; a handover point belongs to neither side's private tree.
webhook_deploy_requests_dir: /var/lib/jamground/deploy-requests
webhook_site_checkout: /srv/jamground/repos/site
webhook_content_checkout: /srv/jamground/repos/content

# Editors push branches against the CONTENT repository only, so its pull requests are
# what the preview trigger (open/close) fires on.
webhook_github_org: "{{ jamground_github_org }}"
webhook_github_repo: "{{ jamground_content_repo }}"
webhook_domain: "hooks.{{ jamground_domain }}"
webhook_url: "https://{{ webhook_domain }}/"
webhook_events:
  - pull_request
