---
# Every deploy is a fresh release directory; going live is one atomic rename(2). This
# role converges the directory tree, ships the mechanism — jamground-deploy and the two
# no-argument root wrappers roles/users already grants jamground sudo on — and seeds ONE empty
# release so /srv/jamground/current is never a dangling symlink. nginx resolves it per request
# (roles/nginx's nginx_release_root points at this same path), and a dangling root is a 500 on
# every request until the first real build.

- name: Ensure the release root exists
  ansible.builtin.file:
    path: "{{ deploy_root }}"
    state: directory
    owner: jamground-build
    group: jamground-build
    mode: '0755'

- name: Ensure the releases directory exists
  ansible.builtin.file:
    path: "{{ deploy_releases_dir }}"
    state: directory
    owner: jamground-build
    group: jamground-build
    mode: '0755'

- name: Ship the deploy script — build, verify, create the release, flip
  ansible.builtin.copy:
    src: jamground-deploy
    dest: "{{ deploy_script_path }}"
    owner: root
    group: root
    mode: '0755'

- name: Ensure /etc/jamground exists
  ansible.builtin.file:
    path: /etc/jamground
    state: directory
    owner: root
    group: root
    mode: '0755'

# The build runs on the box, inside jamground-deploy, where the operator's `.env` does not exist
# and never will — Ansible copies it nowhere. Without this file the build resolves all six of
# jamground.config.mjs's values to their committed placeholders and emits `example.com` canonical
# URLs while exiting 0, which is the shape of failure this tree refuses. The converge is the one
# moment that knows both the operator's environment and the box.
#
# 0644 and root-owned because every value in it is public by construction — all six are baked
# into the editor bundle at build time wherever they are written. No secret is ever templated
# here; the three that exist are named by path in .env.example and stay at those paths.
- name: Write the box's own copy of the deployment's identity, for the build to source
  ansible.builtin.template:
    src: deploy.env.j2
    dest: "{{ deploy_env_file }}"
    owner: root
    group: root
    mode: '0644'

- name: Ship the release-switch wrapper — the one privileged half of a deploy, no arguments
  ansible.builtin.copy:
    src: jamground-release-switch
    dest: "{{ jamground_release_switch }}"
    owner: root
    group: root
    mode: '0700'

# ── The automatic path ────────────────────────────────────────────────────────────────────────
#
# Three directories, and the owner of each is the account that WRITES it while the group is the
# account that must read it. Deliberately not solved by putting `jamground` in the
# `jamground-build` group: /etc/jamground/webhook.secret is 0640 root:jamground-build, so that
# membership would hand the orchestrator account GitHub's HMAC secret for the sake of a directory.
- name: Ensure the deploy-request queue exists, writable by the account that decides
  ansible.builtin.file:
    path: "{{ deploy_requests_dir }}"
    state: directory
    owner: jamground-build
    group: "{{ deploy_orchestrator_user }}"
    # 0770: the reader does not merely read here, it MOVES files out, which needs write on the
    # directory. 0750 would leave every merge quarantined, silently, for ever.
    mode: '0770'

- name: Ensure the claimed and failed request directories exist, owned by the account that drains
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ deploy_orchestrator_user }}"
    group: "{{ item.group }}"
    mode: '0750'
  loop:
    - path: "{{ deploy_requests_claimed_dir }}"
      group: "{{ deploy_orchestrator_user }}"
    # The failed directory's group is jamground-build so that jamground-selfcheck — which runs as
    # that account — can count what is in it. That count is the alarm for a merge that never
    # reached production.
    - path: "{{ deploy_requests_failed_dir }}"
      group: jamground-build
  loop_control:
    label: "{{ item.path }}"

- name: Ship the deploy-now wrapper — a whole deploy, no arguments
  ansible.builtin.copy:
    src: jamground-deploy-now
    dest: "{{ jamground_deploy_now }}"
    owner: root
    group: root
    mode: '0700'

- name: Ship the request-queue runner the orchestrator account executes
  ansible.builtin.copy:
    src: jamground-deploy-requests
    dest: "{{ deploy_request_runner_path }}"
    owner: root
    group: root
    mode: '0755'

- name: Install the deploy-request units
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item | replace('.j2', '') }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - jamground-deploy-request.service.j2
    - jamground-deploy-request.path.j2
  notify: reload systemd daemon

- name: Flush handlers so the units exist before they are enabled
  ansible.builtin.meta: flush_handlers

# The PATH unit is enabled; the SERVICE is not. A Type=oneshot that is `enabled` runs once at boot
# and never again — which would deploy on every reboot for no reason and still never deploy on a
# merge.
- name: Enable the deploy-request path unit
  ansible.builtin.systemd:
    name: "{{ deploy_request_path_name }}"
    enabled: true
    state: started

- name: Ship the reload-nginx wrapper — the other privileged half of a deploy, no arguments
  ansible.builtin.copy:
    src: jamground-reload-nginx
    dest: "{{ jamground_reload_nginx }}"
    owner: root
    group: root
    mode: '0700'

- name: Check whether current already points somewhere
  ansible.builtin.stat:
    path: "{{ deploy_current }}"
  register: deploy_current_stat

# Only ever runs once: subsequent converges see current already resolved and skip the whole
# block, which is what makes this idempotent rather than re-seeding over a real release.
- name: Seed one empty release so current is never dangling
  when: not deploy_current_stat.stat.exists
  block:
    - name: Create the seed release's public directory
      ansible.builtin.file:
        path: "{{ deploy_releases_dir }}/{{ deploy_seed_release }}/public"
        state: directory
        owner: jamground-build
        group: jamground-build
        mode: '0755'

    - name: Write a placeholder index so the seed release is servable
      ansible.builtin.copy:
        dest: "{{ deploy_releases_dir }}/{{ deploy_seed_release }}/public/index.html"
        owner: jamground-build
        group: jamground-build
        mode: '0644'
        content: |
          <!doctype html>
          <title>jamground</title>
          <p>Awaiting the first build.</p>

    - name: Write a release manifest that parses
      ansible.builtin.copy:
        dest: "{{ deploy_releases_dir }}/{{ deploy_seed_release }}/manifest.json"
        owner: jamground-build
        group: jamground-build
        mode: '0644'
        content: >-
          {{ {'release': deploy_seed_release, 'contentSha': 'seed', 'siteSha': 'seed',
          'builtAt': '1970-01-01T00:00:00Z'} | to_nice_json }}

    - name: Stage the seed release for the flip
      ansible.builtin.file:
        src: "releases/{{ deploy_seed_release }}"
        dest: "{{ deploy_root }}/.current.tmp"
        state: link
        force: true

    - name: mv -T the staged symlink into place — rename(2), never unlink-then-link
      ansible.builtin.command:
        argv: [mv, -T, "{{ deploy_root }}/.current.tmp", "{{ deploy_current }}"]
      changed_when: true
