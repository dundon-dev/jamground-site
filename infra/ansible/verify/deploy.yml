---
# Four things to prove: current is a real symlink into releases/ (never dangling — a dangling
# root is a 500 on every request), previous exists once there have been two releases and not
# before (this task itself seeds only one), the deploy mechanism — the script plus its two
# privileged wrappers — is present and executable, since a deploy is only as real as what it
# flips through, and the box knows its own identity, since a build that does not is a build for
# `example.com`.
#
# The domain-agnostic paths are repeated here rather than sourced from roles/deploy/defaults,
# the same way verify/nginx.yml repeats nginx_domain: a verify playbook must not depend on a
# converge-time variable it never loads.
- name: Verify the release directories and the symlink flip
  hosts: jamground
  gather_facts: false
  vars:
    deploy_root: /srv/jamground
    deploy_releases_dir: /srv/jamground/releases
    deploy_env_file: /etc/jamground/deploy.env
    # The six keys the build reads, repeated here for the same reason the paths above are: a
    # verify playbook asserts against literals it owns, so that a converge-time variable being
    # wrong cannot make the assertion agree with it.
    deploy_env_keys:
      - JAMGROUND_DOMAIN
      - JAMGROUND_GITHUB_ORG
      - JAMGROUND_SITE_REPO
      - JAMGROUND_CONTENT_REPO
      - JAMGROUND_CONTENT_BRANCH
      - JAMGROUND_OAUTH_CLIENT_ID
    # The automatic-deploy chain, as literals for the same reason. Every one of these is a
    # roles/deploy or roles/users default that this play never loads — and repeating them here is
    # not duplication being tolerated, it is the point: an assertion that read the same variable
    # the converge wrote would agree with a wrong value as readily as a right one.
    jamground_deploy_now: /usr/local/sbin/jamground-deploy-now
    deploy_orchestrator_user: jamground
    deploy_production_slice: jamground-production.slice
    deploy_request_service_name: jamground-deploy-request
    deploy_request_path_name: jamground-deploy-request.path
    deploy_requests_dir: /var/lib/jamground/deploy-requests
    deploy_requests_claimed_dir: /var/lib/jamground/deploy-requests.claimed
    deploy_requests_failed_dir: /var/lib/jamground/deploy-requests.failed
  tasks:
    - name: Stat current
      ansible.builtin.stat:
        path: "{{ deploy_root }}/current"
      register: deploy_current_stat

    - name: Assert current is a symlink
      ansible.builtin.assert:
        that:
          - deploy_current_stat.stat.exists
          - deploy_current_stat.stat.islnk
        fail_msg: "{{ deploy_root }}/current does not exist or is not a symlink"

    - name: Resolve what current points at
      ansible.builtin.command: readlink -f {{ deploy_root }}/current
      register: deploy_current_target
      check_mode: false
      changed_when: false

    - name: Assert current resolves into releases/
      ansible.builtin.assert:
        that:
          - deploy_current_target.stdout is search(deploy_releases_dir)
        fail_msg: >-
          {{ deploy_root }}/current resolves to {{ deploy_current_target.stdout }}, outside
          {{ deploy_releases_dir }}

    - name: Count release directories
      ansible.builtin.find:
        paths: "{{ deploy_releases_dir }}"
        file_type: directory
      register: deploy_release_dirs

    - name: Stat previous
      ansible.builtin.stat:
        path: "{{ deploy_root }}/previous"
      register: deploy_previous_stat

    - name: Assert previous exists once there have been two releases
      ansible.builtin.assert:
        that:
          - (deploy_release_dirs.matched | int) < 2 or deploy_previous_stat.stat.exists
        fail_msg: >-
          {{ deploy_release_dirs.matched }} release directories exist but
          {{ deploy_root }}/previous does not

    - name: Stat the deploy script
      ansible.builtin.stat:
        path: /usr/local/bin/jamground-deploy
      register: deploy_script_stat

    - name: Assert the deploy script is present and executable
      ansible.builtin.assert:
        that:
          - deploy_script_stat.stat.exists
          - deploy_script_stat.stat.executable
        fail_msg: /usr/local/bin/jamground-deploy does not exist or is not executable

    - name: Stat the release-switch wrapper
      ansible.builtin.stat:
        path: /usr/local/sbin/jamground-release-switch
      register: deploy_release_switch_stat

    - name: Assert the release-switch wrapper is present and executable
      ansible.builtin.assert:
        that:
          - deploy_release_switch_stat.stat.exists
          - deploy_release_switch_stat.stat.executable
        fail_msg: /usr/local/sbin/jamground-release-switch does not exist or is not executable

    - name: Stat the reload-nginx wrapper
      ansible.builtin.stat:
        path: /usr/local/sbin/jamground-reload-nginx
      register: deploy_reload_nginx_stat

    - name: Assert the reload-nginx wrapper is present and executable
      ansible.builtin.assert:
        that:
          - deploy_reload_nginx_stat.stat.exists
          - deploy_reload_nginx_stat.stat.executable
        fail_msg: /usr/local/sbin/jamground-reload-nginx does not exist or is not executable

    # The build finds content/ only through JAMGROUND_CONTENT_DIR. This is a state
    # assertion about the DEPLOYED script — not a log grep, and not a rerun of the build — so a
    # regression that drops the export is caught even between real deploys. Proving end to end
    # that the build then finds content/ is a separate role's job.
    - name: Read the shipped deploy script back off the box
      ansible.builtin.slurp:
        path: /usr/local/bin/jamground-deploy
      register: deploy_script_slurp

    - name: Assert the shipped script sets JAMGROUND_CONTENT_DIR for the build
      ansible.builtin.assert:
        that:
          - "'JAMGROUND_CONTENT_DIR' in (deploy_script_slurp.content | b64decode)"
        fail_msg: >-
          /usr/local/bin/jamground-deploy does not set JAMGROUND_CONTENT_DIR; the build has no
          way to locate content/ (OD-29)

    # The other half of the same argument. The build finds content/ through
    # JAMGROUND_CONTENT_DIR; it finds out WHOSE SITE IT IS through this file, and nothing else on
    # the box knows — `.env` is on the operator's machine and Ansible copies it nowhere. A box
    # without it builds `example.com` canonical URLs and exits 0. Asserted as state, read back
    # off the box, exactly like the assertion above.
    - name: Stat the identity file the build sources
      ansible.builtin.stat:
        path: "{{ deploy_env_file }}"
      register: deploy_env_stat

    - name: Assert the identity file exists, root-owned and world-readable
      ansible.builtin.assert:
        that:
          - deploy_env_stat.stat.exists
          - deploy_env_stat.stat.pw_name == 'root'
          - deploy_env_stat.stat.mode == '0644'
        fail_msg: >-
          {{ deploy_env_file }} does not exist, or is not root-owned mode 0644. 0644 is
          deliberate: every value in it is public by construction and the unprivileged build
          account must be able to read it. A stricter mode here means someone has put something
          in it that does not belong — no secret is ever written to this file.

    - name: Read the identity file back off the box
      ansible.builtin.slurp:
        path: "{{ deploy_env_file }}"
      register: deploy_env_slurp

    - name: Assert it declares every value the build reads
      ansible.builtin.assert:
        that:
          - (key ~ '=') in (deploy_env_slurp.content | b64decode)
        fail_msg: >-
          {{ deploy_env_file }} does not declare {{ key }}, so a build on this box resolves it to
          the placeholder committed in jamground.config.mjs and says so in every canonical URL it
          emits — while exiting 0
      loop: "{{ deploy_env_keys }}"
      loop_control:
        loop_var: key

    - name: Assert it declares nothing beyond those six — this file is public, not a secret store
      ansible.builtin.assert:
        that:
          - deploy_env_declared == deploy_env_keys
        fail_msg: >-
          {{ deploy_env_file }} declares {{ deploy_env_declared | join(', ') }}, which is not the
          six {{ deploy_env_keys | join(', ') }}. The file is mode 0644 because those six are
          public by construction; anything else in it is being published to every account on this
          box. Secrets are named by path in .env.example and stay at those paths.
      vars:
        deploy_env_declared: >-
          {{ (deploy_env_slurp.content | b64decode).splitlines()
             | select('match', '^[A-Za-z_][A-Za-z0-9_]*=') | map('regex_replace', '=.*$', '')
             | list }}

    # ── The automatic path: a merged pull request deploys production ──────────────────────────
    #
    # Every check here is about a chain whose failures are silent. A .path unit watching a
    # directory that does not exist waits for ever and reports active; a Type=oneshot with
    # systemd's 90-second default timeout kills a build part-way through and reports the script as
    # having failed; NoNewPrivileges=yes — which every other unit on this box sets — breaks sudo
    # rather than narrowing it. Each is asserted against what systemd has actually LOADED, not
    # against the template that produced it, for the reason verify/nginx.yml gives about the hooks
    # vhost: a template that obviously has the setting in it is exactly what was believed at the
    # time.
    - name: Stat the deploy-now wrapper
      ansible.builtin.stat:
        path: "{{ jamground_deploy_now }}"
      register: deploy_now_stat

    - name: Assert the deploy-now wrapper is present, root-owned and not group- or world-readable
      ansible.builtin.assert:
        that:
          - deploy_now_stat.stat.exists
          - deploy_now_stat.stat.pw_name == 'root'
          - deploy_now_stat.stat.mode == '0700'
        fail_msg: >-
          {{ jamground_deploy_now }} is missing or not a root-owned 0700 file. It is what fixes
          both checkout paths and the build account, so that the sudo grant naming it can take no
          arguments; a writable or readable copy is a grant that takes whatever it says.

    - name: Query the deploy-request service's loaded settings
      ansible.builtin.command: >-
        systemctl show {{ deploy_request_service_name }}.service
        --property=User --property=NoNewPrivileges --property=TimeoutStartUSec --property=Slice
      register: deploy_request_show
      check_mode: false
      changed_when: false

    - name: Assert the deploy-request service runs privileged enough to flip and long enough to build
      ansible.builtin.assert:
        that:
          - ('User=' ~ deploy_orchestrator_user) in deploy_request_show.stdout_lines
          - "'NoNewPrivileges=no' in deploy_request_show.stdout_lines"
          - ('Slice=' ~ deploy_production_slice) in deploy_request_show.stdout_lines
          # NOT a duration comparison. systemctl prints this property human-readably — "1h", not a
          # microsecond count — so the arithmetic this used to do parsed "1h" to 1 and failed
          # against a correctly configured unit. What is worth asserting is the property itself:
          # BOUNDED rather than unbounded. Type=oneshot disables the start timeout by default
          # (systemd.service(5)), so `infinity` here is exactly what an omitted setting looks
          # like, and the offline gate holds the configured value above the lock's 900s wait.
          - "'TimeoutStartUSec=infinity' not in deploy_request_show.stdout_lines"
        fail_msg: >-
          {{ deploy_request_service_name }}.service is loaded as
          {{ deploy_request_show.stdout_lines | join(', ') }}. It must run as
          {{ deploy_orchestrator_user }} (the account holding the wrappers), with
          NoNewPrivileges=no (sudo is setuid; yes breaks the grant rather than narrowing it), in
          {{ deploy_production_slice }}, and with a bounded start timeout. A oneshot with no
          TimeoutStartSec is unbounded, and a deploy that wedges holds the shared build lock —
          stopping every preview build on this box until someone notices by hand.

    - name: Query the deploy-request path unit's state
      ansible.builtin.command: systemctl is-enabled {{ deploy_request_path_name }}
      register: deploy_request_path_enabled
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Assert the path unit is enabled — nothing else ever starts the service
      ansible.builtin.assert:
        that:
          - deploy_request_path_enabled.stdout == 'enabled'
        fail_msg: >-
          {{ deploy_request_path_name }} is {{ deploy_request_path_enabled.stdout }}. Disabled, it
          does not survive a reboot, and a merged pull request then updates the content repository
          and never the live site — with every other signal on this box still green.

    - name: Stat the three deploy-request directories
      ansible.builtin.stat:
        path: "{{ item }}"
      register: deploy_request_dir_stats
      loop:
        - "{{ deploy_requests_dir }}"
        - "{{ deploy_requests_claimed_dir }}"
        - "{{ deploy_requests_failed_dir }}"

    - name: Assert the incoming queue is writable by the writer and drainable by the reader
      ansible.builtin.assert:
        that:
          - incoming.stat.exists
          - incoming.stat.pw_name == 'jamground-build'
          - incoming.stat.gr_name == deploy_orchestrator_user
          - incoming.stat.mode == '0770'
          - (deploy_request_dir_stats.results | selectattr('stat.exists') | list | length) == 3
        fail_msg: >-
          The deploy-request directories are wrong. The incoming queue must be
          jamground-build:{{ deploy_orchestrator_user }} 0770 — the reader MOVES files out of it,
          which needs write on the directory, and 0750 would leave every merge quarantined
          silently and for ever.
      vars:
        incoming: "{{ deploy_request_dir_stats.results | first }}"

    - name: Assert the shipped deploy script takes the shared build lock
      ansible.builtin.assert:
        that:
          - "'flock -w' in (deploy_script_slurp.content | b64decode)"
          - "'.build.lock' in (deploy_script_slurp.content | b64decode)"
        fail_msg: >-
          The jamground-deploy on this box does not take the build lock. Its `npm ci` deletes
          node_modules in the site checkout that every preview build reads, and nothing else
          serialises the two — so an automatic deploy can pull the dependency tree out from under
          a preview build that is running. (deploy_script_slurp is the same read this play already
          made above, reused rather than repeated.)

