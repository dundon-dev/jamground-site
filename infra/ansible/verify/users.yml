---
# Two things to prove: jamground-build is entitled to nothing, and jamground is entitled to
# exactly the two no-argument wrappers roles/users granted it — no more, no less. `sudo -l -U`
# is a read query, but it is still the `command:` module (check mode skips it), so it says what
# it does in check mode explicitly rather than by the accident of never being run with --check.
- name: Verify the two accounts and their sudo entitlements
  hosts: jamground
  gather_facts: false
  tasks:
    - name: Query jamground-build's sudo entitlements
      ansible.builtin.command: sudo -l -U jamground-build
      register: build_sudo
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Assert jamground-build is entitled to nothing
      ansible.builtin.assert:
        that:
          - "'not allowed to run sudo' in build_sudo.stdout"
        fail_msg: >-
          jamground-build has sudo entitlements, or the account does not exist:
          {{ build_sudo.stdout }}

    - name: Query jamground's sudo entitlements
      ansible.builtin.command: sudo -l -U jamground
      register: orchestrator_sudo
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Assert jamground holds exactly the two no-argument wrappers
      ansible.builtin.assert:
        that:
          - orchestrator_sudo.stdout is search('/usr/local/sbin/jamground-release-switch')
          - orchestrator_sudo.stdout is search('/usr/local/sbin/jamground-reload-nginx')
          - orchestrator_sudo.stdout_lines | select('match', '^\\s*\\(root\\)\\s+NOPASSWD:') | list | length == 2
        fail_msg: >-
          jamground's sudo entitlements are not exactly the two fixed wrappers:
          {{ orchestrator_sudo.stdout }}
