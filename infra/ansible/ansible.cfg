[defaults]
inventory = inventory.yml
roles_path = roles
host_key_checking = True
# Diff on by default: a converge that does not say what it changed is a converge nobody reviewed.
stdout_callback = default
callback_whitelist = default
result_format = yaml
[ssh_connection]
# `piped` rather than the default sftp/scp negotiation, so module delivery stays inside the
# ssh channel rather than opening a separate scp/rsync connection.
transfer_method = piped
pipelining = True
